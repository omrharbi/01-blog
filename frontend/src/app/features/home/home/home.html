<main
  class="main flex-1 overflow-auto p-6 bg-gray-50 accordion flex-1 p-6 lg:p-8 max-w-4xl mx-auto w-full d-flex align-items-lg-center justify-content-center align-content-center align-items-center">
  <div class="cards space-y-4 scroll mx-3">
    <div class="card-sher" *ngIf="!isAuthenticated">


      <app-card-share></app-card-share>

    </div>

    <!-- <div *ngFor="let p of posts$ | async">
    {{p.firstname}}

  <p>
    jhjhk
  </p>
</div> -->
    <div class="posts">
      <div class="row g-4">
        <!-- Left feed section -->
        <div class="col-12 col-lg-8">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h4 fw-semibold font-playfair">Your Feed</h2>
            <div class="d-flex gap-2">
              <button class="btn btn-sm text-muted d-flex align-items-center">
                <mat-icon>access_time</mat-icon>
                Recent
              </button>
              <button class="btn btn-sm text-muted d-flex align-items-center">
                <mat-icon>star_border</mat-icon>
                Following
              </button>
            </div>
          </div>

          <!-- Example post card -->
          <ng-container *ngIf="loading_post">
            <div class="feed-skeleton  skeleton" role="status" aria-live="polite" aria-busy="true">
              <div *ngFor="let placeholder of [0,1,2]"
                class="card border rounded-3 shadow-sm mb-4 feed-card--placeholder p-4">

                <!-- Header: avatar + name -->
                <div class="d-flex align-items-center mb-3">
                  <div class="rounded-circle bg-light me-3" style="width: 40px; height: 40px;"></div>
                  <div class="flex-grow-1">
                    <div class="bg-light mb-1" style="height: 12px; width: 120px;"></div>
                    <div class="bg-light" style="height: 10px; width: 80px;"></div>
                  </div>
                </div>

                <!-- Title -->
                <div class="bg-light mb-2" style="height: 20px; width: 60%;"></div>

                <!-- Content -->
                <div class="bg-light mb-2" style="height: 14px; width: 100%;"></div>
                <div class="bg-light mb-2" style="height: 14px; width: 95%;"></div>
                <div class="bg-light mb-3" style="height: 14px; width: 90%;"></div>

                <!-- Image placeholder -->
                <div class="bg-light mb-3 rounded" style="height: 150px; width: 100%;"></div>

                <!-- Actions: like/comment -->
                <div class="d-flex gap-3">
                  <div class="bg-light rounded" style="width: 50px; height: 20px;"></div>
                  <div class="bg-light rounded" style="width: 50px; height: 20px;"></div>
                </div>

              </div>
            </div>
          </ng-container>
          <ng-container *ngIf="!loading_post">
            <div class="card-post">
              <app-post-card *ngFor="let post of posts " [post]="post"></app-post-card>
            </div>

            <div class="text-center pt-4" *ngIf="posts.length > 0">
              <button class="btn btn-outline-secondary px-4" (click)="loadMorePosts()"
                [disabled]="loading || !hasMorePosts()">
                <span *ngIf="!loading && hasMorePosts()">Load More Posts</span>
                <span *ngIf="loading">
                  <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                  Loading...
                </span>
                <span *ngIf="!loading && !hasMorePosts()">No More Posts</span>
              </button>
            </div>
          </ng-container>

        </div>

        <!-- Right sidebar -->

        <ng-container *ngIf="loading_post">
          <div class="col-12 col-lg-4" >
            <!-- Trending Topics -->
            <div class="card shadow-sm mb-4 border-0 p-4">
              <div class="bg-light mb-2" style="height: 20px; width: 150px;"></div>
              <div *ngFor="let t of [0,1,2,3,4]" class="d-flex justify-content-between mb-2">
                <div class="bg-light rounded" style="height: 14px; width: 70%;"></div>
                <div class="bg-light rounded" style="height: 14px; width: 20%;"></div>
              </div>
            </div>

            <!-- Your Activity -->
            <div class="card shadow-sm border-0 p-4">
              <div class="bg-light mb-3" style="height: 20px; width: 150px;"></div>
              <div class="d-flex justify-content-between mb-2">
                <div class="bg-light rounded" style="height: 14px; width: 70%;"></div>
                <div class="bg-light rounded" style="height: 14px; width: 20%;"></div>
              </div>
              <div class="d-flex justify-content-between mb-2">
                <div class="bg-light rounded" style="height: 14px; width: 70%;"></div>
                <div class="bg-light rounded" style="height: 14px; width: 20%;"></div>
              </div>
              <div class="d-flex justify-content-between mb-2">
                <div class="bg-light rounded" style="height: 14px; width: 70%;"></div>
                <div class="bg-light rounded" style="height: 14px; width: 20%;"></div>
              </div>
            </div>
          </div>
        </ng-container>

        <ng-container *ngIf="!loading_post">


          <div class="col-12 col-lg-4">
            <div class="card shadow-sm mb-4 border-0 bg-card">
              <div class="card-body">
                <div class="d-flex align-items-center mb-3">
                  <i class="bi bi-graph-up text-accent me-2"></i>
                  <h3 class="h6 fw-semibold mb-0">Trending Topics</h3>
                </div>
                <!-- {{tags}}/////*********** -->
                <ul class="list-unstyled" *ngFor="let tag of trand">
                  <li class="d-flex justify-content-between mb-2 ">
                    <span class="">#1 {{tag.tagName}} <span class="badge     tag">Trending</span></span>
                    <span class="small text-muted">{{tag.postCount}} posts</span>
                  </li>

                </ul>
              </div>
            </div>

            <div class="card shadow-sm border-0 bg-card" *ngIf="isAuthenticated">
              <div class="card-body">
                <h3 class="h6 fw-semibold mb-3">Your Activity</h3>
                <div class="d-flex justify-content-between"><span class="text-muted">Posts published</span><span
                    class="fw-semibold">{{countPosts()}}</span></div>
                <!-- <div class="d-flex justify-content-between"><span class="text-muted">Total views</span><span
                  class="fw-semibold">1,247</span></div> -->
                <div class="d-flex justify-content-between"><span class="text-muted">Followers</span><span
                    class="fw-semibold">{{countFollowers()}}</span></div>
                <div class="d-flex justify-content-between"><span class="text-muted">Following</span><span
                    class="fw-semibold">{{countFollowing()}}</span></div>
              </div>
            </div>
          </div>

        </ng-container>

      </div>

    </div>
    <!-- Your existing content -->

    <!-- <div *ngIf="isNotificated" appClickOutside (clickOutside)="closeNotification()" class="notification-wrapper">
      <app-notifications></app-notifications>
    </div> -->
  </div>
</main>
