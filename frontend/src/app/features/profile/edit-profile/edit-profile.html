<div class="edit-profile-container px-4 py-4">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h3 font-playfair fw-bold">Edit Profile</h2>
        <button class="btn btn-sm btn-custom-secondary">
            <i class="bi bi-x-lg"></i> Cancel
        </button>
    </div>

    <!-- Cover & Avatar Section -->
    <div class="card card-custom mb-4">
        <div class="card-body p-4">
            <h5 class="h6 fw-bold mb-3">Profile Images</h5>
            
            <!-- Cover Image -->
            <div class="mb-4">
                <label class="form-label small text-muted-custom">Cover Image</label>
                <div class="cover-upload position-relative">
                    <img src="https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=1200" alt="Cover" class="w-100" style="height: 200px; object-fit: cover; border-radius: 12px;">
                    <button class="btn btn-custom-primary position-absolute top-50 start-50 translate-middle">
                        <i class="bi bi-camera"></i> Change Cover
                    </button>
                </div>
            </div>

            <!-- Avatar -->
            <div>
                <label class="form-label small text-muted-custom">Profile Picture</label>
                <div class="d-flex align-items-center gap-3">
                    <div class="avatar-lg">
                        <img src="https://ui-avatars.com/api/?name=John+Developer&background=22c55e&color=fff&size=128" alt="Avatar">
                    </div>
                    <div>
                        <button class="btn btn-custom-primary btn-sm mb-2">
                            <i class="bi bi-upload"></i> Upload Photo
                        </button>
                        <button class="btn btn-outline-danger btn-sm d-block">
                            <i class="bi bi-trash"></i> Remove
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Basic Information -->
    <div class="card card-custom mb-4">
        <div class="card-body p-4">
            <h5 class="h6 fw-bold mb-3">Basic Information</h5>
            
            <div class="row g-3">
                <!-- First Name -->
                <div class="col-md-6">
                    <label class="form-label small text-muted-custom">First Name *</label>
                    <input type="text" class="form-control form-control-custom" placeholder="John" value="John">
                </div>

                <!-- Last Name -->
                <div class="col-md-6">
                    <label class="form-label small text-muted-custom">Last Name *</label>
                    <input type="text" class="form-control form-control-custom" placeholder="Developer" value="Developer">
                </div>

                <!-- Username -->
                <div class="col-md-6">
                    <label class="form-label small text-muted-custom">Username *</label>
                    <div class="input-group">
                        <span class="input-group-text" style="background: var(--input-color); border-color: var(--input-border); color: var(--text-muted);">@</span>
                        <input type="text" class="form-control form-control-custom" placeholder="johndev" value="johndev">
                    </div>
                    <small class="text-muted-custom">Your unique username</small>
                </div>

                <!-- Email -->
                <div class="col-md-6">
                    <label class="form-label small text-muted-custom">Email *</label>
                    <input type="email" class="form-control form-control-custom" placeholder="john@example.com" value="john@example.com">
                </div>

                <!-- About -->
                <div class="col-12">
                    <label class="form-label small text-muted-custom">About</label>
                    <textarea class="form-control form-control-custom" rows="4" placeholder="Tell us about yourself...">Full-stack developer passionate about React, Node.js, and building great user experiences.</textarea>
                    <small class="text-muted-custom">Max 500 characters</small>
                </div>
            </div>
        </div>
    </div>

    <!-- Skills & Interests -->
    <div class="card card-custom mb-4">
        <div class="card-body p-4">
            <h5 class="h6 fw-bold mb-3">Skills & Interests</h5>
            
            <div class="mb-3">
                <label class="form-label small text-muted-custom">Add Skills</label>
                <div class="input-group mb-3">
                    <input type="text" class="form-control form-control-custom" placeholder="e.g. JavaScript, React, Node.js">
                    <button class="btn btn-custom-primary">
                        <i class="bi bi-plus-lg"></i> Add
                    </button>
                </div>
            </div>

            <!-- Skills Display -->
            <div class="d-flex flex-wrap gap-2">
                <span class="tag tag-removable">
                    JavaScript
                    <i class="bi bi-x ms-1"></i>
                </span>
                <span class="tag tag-removable">
                    React
                    <i class="bi bi-x ms-1"></i>
                </span>
                <span class="tag tag-removable">
                    Node.js
                    <i class="bi bi-x ms-1"></i>
                </span>
                <span class="tag tag-removable">
                    TypeScript
                    <i class="bi bi-x ms-1"></i>
                </span>
                <span class="tag tag-removable">
                    MongoDB
                    <i class="bi bi-x ms-1"></i>
                </span>
                <span class="tag tag-removable">
                    Docker
                    <i class="bi bi-x ms-1"></i>
                </span>
            </div>
        </div>
    </div>

    <!-- Social Links -->
    <div class="card card-custom mb-4">
        <div class="card-body p-4">
            <h5 class="h6 fw-bold mb-3">Social Links</h5>
            
            <div class="row g-3">
                
                <!-- GitHub -->
                <div class="col-md-6">
                    <label class="form-label small text-muted-custom">
                        <i class="bi bi-github me-1"></i> GitHub
                    </label>
                    <input type="text" class="form-control form-control-custom" placeholder="github.com/username" value="github.com/johndev">
                </div>

                

                <!-- LinkedIn -->
                <div class="col-md-6">
                    <label class="form-label small text-muted-custom">
                        <i class="bi bi-linkedin me-1"></i> LinkedIn
                    </label>
                    <input type="text" class="form-control form-control-custom" placeholder="linkedin.com/in/username" value="linkedin.com/in/johndev">
                </div>
            </div>
        </div>
    </div>

 

    <!-- Action Buttons -->
    <div class="d-flex gap-3 justify-content-end">
        <button class="btn btn-custom-secondary px-4">
            <i class="bi bi-x-circle me-2"></i>Cancel
        </button>
        <button class="btn btn-custom-primary px-4">
            <i class="bi bi-check-circle me-2"></i>Save Changes
        </button>
    </div>
</div>
