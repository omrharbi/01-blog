<header class="custom-header w-full">
    <!-- DESKTOP HEADER -->
    <nav class="container px-5 py-2 desktop-nav">
        <div class="d-flex align-items-center justify-content-between">
            <!-- Logo -->
            <div class="d-flex align-items-center gap-5">
                <a class="d-flex align-items-center gap-2 text-decoration-none fs-4 fw-bold"
                    routerLink="/admin">
                    <div class="custom-logo">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="text-white">
                            <rect width="7" height="9" x="3" y="3" rx="1"></rect>
                            <rect width="7" height="5" x="14" y="3" rx="1"></rect>
                            <rect width="7" height="9" x="14" y="12" rx="1"></rect>
                            <rect width="7" height="5" x="3" y="16" rx="1"></rect>
                        </svg>
                    </div>
                    01Blog
                </a>
                <!-- Desktop Navigation -->
                <div class="d-flex gap-1 desktop-links">
                    <a class="custom-nav-link" routerLink="/" routerLinkActive="active" 
                       [routerLinkActiveOptions]="{ exact: true }">Home</a>
                    <a class="custom-nav-link" routerLink="/admin" routerLinkActive="active">Dashboard</a>
                    <a class="custom-nav-link" routerLink="/admin/users" routerLinkActive="active">Users</a>
                    <a class="custom-nav-link" routerLink="/admin/posts" routerLinkActive="active">Posts</a>
                    <a class="custom-nav-link" routerLink="/admin/reports" routerLinkActive="active">Reports</a>
                </div>
            </div>
            <!-- Theme Toggle -->
            <button class="theme-toggle">
                <mat-icon>light_mode</mat-icon>
            </button>
        </div>
    </nav>
</header>

<!-- MOBILE BOTTOM NAV (only visible on mobile/tablet) -->
<nav class="mobile-bottom-nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon>home</mat-icon>
        <span>Home</span>
    </a>
    <a routerLink="/admin" routerLinkActive="active">
        <mat-icon>dashboard</mat-icon>
        <span>Dashboard</span>
    </a>
    <a routerLink="/admin/users" routerLinkActive="active">
        <mat-icon>group</mat-icon>
        <span>Users</span>
    </a>
    <a routerLink="/admin/posts" routerLinkActive="active">
        <mat-icon>article</mat-icon>
        <span>Posts</span>
    </a>
    <a routerLink="/admin/reports" routerLinkActive="active">
        <mat-icon>flag</mat-icon>
        <span>Reports</span>
    </a>
</nav>
