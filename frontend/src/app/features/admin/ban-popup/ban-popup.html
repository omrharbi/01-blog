<div class="popup-overlay" *ngIf="isVisible" (click)="onOverlayClick($event)">
    <!-- Step 1: Confirmation -->
    <div class="popup-container" *ngIf="step === 1" (click)="$event.stopPropagation()">
        <div class="popup-header">
            <h2>Confirm {{actionType}}</h2>
            <button class="close-btn" (click)="closePopup()">&times;</button>
        </div>
        <div class="popup-body">
            <div class="icon-wrapper" [ngSwitch]="actionType">
                <div *ngSwitchCase="'ban'" class="icon-ban">⚠️</div>
                <div *ngSwitchCase="'unban'" class="icon-unban">✅</div>
                <div *ngSwitchCase="'delete'" class="icon-delete">🗑️</div>
                <div *ngSwitchCase="'role'" class="icon-delete">✅</div>
                <div *ngSwitchDefault>❓</div>
            </div>
            <p class="message">Are you sure you want to {{actionType==='role'?"change":"" }}  {{actionType}} this user?</p>
            <p class="sub-message">This action will restrict their access.</p>
        </div>
        <div class="popup-footer">
            <button class="btn btn-cancel" (click)="closePopup()">Cancel</button>
            <div class="icon-wrapper" [ngSwitch]="actionType">
                <div *ngSwitchCase="'ban'" class="icon-ban">
                    <button class="btn btn-confirm" (click)="nextStep()">Yes, {{actionType}} User</button>
                </div>
                <div *ngSwitchCase="'unban'" class="icon-unban"><button class="btn btn-confirm"
                        (click)="confirmBan()">Yes,Ban {{actionType}}</button></div>
                <div *ngSwitchCase="'delete'" class="icon-delete">
                    <button class="btn btn-confirm" (click)="deleteUser()">Yes,{{actionType}}</button>
                </div>
                 <div *ngSwitchCase="'delete-post'" class="icon-delete">
                    <button class="btn btn-confirm" (click)="deletePost()">Yes,{{actionType}}</button>
                </div>

                <div *ngSwitchCase="'role'" class="icon-role">
                    <!-- <button class="btn btn-confirm" (click)="nextStep()">Yes, {{actionType}} User</button> -->
                    <button class="btn btn-confirm" (click)="changeRole()">Yes, change {{actionType}}</button>
                </div>
                <div *ngSwitchDefault>❓</div>
            </div>
        </div>
    </div>

    <!-- Step 2: Duration Selection -->
    <div class="popup-container" *ngIf="step === 2" (click)="$event.stopPropagation()">
        <div class="popup-header">
            <h2>{{actionType}} Duration</h2>
            <button class="close-btn" (click)="closePopup()">&times;</button>
        </div>

        <div class="popup-body" *ngIf="actionType=='ban'">
            <p class="message">How many days should this user be banned?</p>
            <div class="duration-input">
                <input type="number" [(ngModel)]="banDays" min="1" max="365" placeholder="Enter days"
                    class="days-input" />
                <span class="days-label">days</span>
            </div>
            <div class="quick-options">
                <button *ngFor="let option of quickOptions" class="quick-btn" (click)="banDays = option">
                    {{ option }} days
                </button>
                <button class="quick-btn" (click)="banDays = 999">Permanent</button>
            </div>
        </div>
        <div class="popup-footer">
            <button class="btn btn-cancel" (click)="previousStep()">Back</button>
            <button class="btn btn-confirm" (click)="confirmBan()" [disabled]="!banDays || banDays < 1">
                Confirm Ban
            </button>
        </div>
    </div>
</div>
